<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="Berlin Type Office, Arial, sans-serif">
  <rect width="1000" height="420" fill="white"/>

  <!-- Step 1 -->
  <rect x="40" y="60" width="240" height="300" rx="8" fill="#f4f6fb" stroke="#002266" stroke-width="2"/>
  <text x="160" y="100" font-size="20" font-weight="bold" fill="#002266" text-anchor="middle">Aktives Gerät</text>
  <text x="60" y="160" font-size="18" fill="#333">verschickt</text>
  <text x="60" y="188" font-size="18" fill="#333">WLAN-Rahmen</text>

  <line x1="280" y1="210" x2="345" y2="210" stroke="#002266" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <rect x="350" y="60" width="300" height="300" rx="8" fill="#f4f6fb" stroke="#002266" stroke-width="2"/>
  <text x="500" y="100" font-size="20" font-weight="bold" fill="#002266" text-anchor="middle">ESP32-C5 Sensor</text>
  <text x="370" y="148" font-size="18" fill="#333">liest passiv im</text>
  <text x="370" y="176" font-size="18" fill="#333">Monitor-Modus (Rust)</text>
  <text x="370" y="224" font-size="18" fill="#333">extrahiert</text>
  <text x="370" y="252" font-size="18" fill="#333">Quell-MAC, Ziel-MAC, RSSI</text>
  <text x="370" y="300" font-size="18" fill="#333">sendet blockweise per Bluetooth</text>

  <line x1="650" y1="210" x2="715" y2="210" stroke="#002266" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <rect x="720" y="60" width="240" height="300" rx="8" fill="#f4f6fb" stroke="#002266" stroke-width="2"/>
  <text x="840" y="100" font-size="20" font-weight="bold" fill="#002266" text-anchor="middle">Smartphone</text>
  <text x="740" y="152" font-size="18" fill="#333">Flutter-App</text>
  <text x="740" y="210" font-size="18" fill="#333">RSSI-Zeitverlaufsgraph</text>
  <text x="740" y="268" font-size="18" fill="#333">haptisches Feedback</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 Z" fill="#002266"/>
    </marker>
  </defs>
</svg>
