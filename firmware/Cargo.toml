[package]
name = "wallbreaker"
description = "The firmware for the ESP32-C5 that is used to send WiFi-Sniffing data to the wallbreaker app."
authors = ["Alexander Betke <hobby@alexinabox.de>"]
repository = "https://git.zeitvertreib.vip/alexinabox/wallbreaker"
license-file = "../LICENSE"
version = "2.0.0"
edition = "2024"

[dependencies]
esp-hal = { version = "~1.1.0", features = ["esp32c5", "log-04", "unstable"] }

esp-rtos = { version = "0.3.0", features = [
  "esp-alloc",
  "esp-radio",
  "esp32c5",
  "log-04",
] }

esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32c5", "log-04"] }
log = "0.4.32"

bleps = { git = "https://github.com/bjoernQ/bleps", package = "bleps", rev = "a5148d8ae679e021b78f53fd33afb8bb35d0b62e", features = [
  "async",
  "macros",
] }
critical-section = "1.2.0"
esp-alloc = "0.10.0"
esp-println = { version = "0.17.0", features = ["esp32c5", "log-04"] }
esp-radio = { version = "0.18.0", features = [
  "ble",
  "coex",
  "esp-alloc",
  "esp32c5",
  "log-04",
  "sniffer",
  "unstable",
  "wifi",
] }


# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1 # LLVM can perform better optimizations using a single thread
debug = 2         # prefer slower builds but better debugging experience
lto = 'fat'
opt-level = 's'
